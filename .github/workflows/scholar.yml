name: Refresh Google Scholar metrics

on:
  schedule:
    - cron: '17 4 * * *'      # daily, 04:17 UTC
  workflow_dispatch:           # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch metrics from Google Scholar
        run: python scripts/fetch_scholar.py

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain metrics.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add metrics.json
            git commit -m "Update Scholar metrics [skip ci]"
            git push
          else
            echo "metrics.json unchanged"
          fi
